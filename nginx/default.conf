# =========================
# MAIN SITE
# =========================
server {
    listen 80;
    server_name tradovatefutures.com www.tradovatefutures.com;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# =========================
# ADMIN PORTAL
# =========================
server {
    listen 80;
    server_name portal.tradovatefutures.com;

    location / {
        proxy_pass http://admin_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# =========================
# API
# =========================
server {
    listen 80;
    server_name api.tradovatefutures.com;

    location / {
        proxy_pass http://admin_server:4000;
        proxy_set_header Host $host;
    }
}

# =========================
# DEFAULT (BLOCK EVERYTHING ELSE)
# =========================
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
