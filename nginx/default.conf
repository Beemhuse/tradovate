# ========================
# API
# ========================
upstream api {
    server admin_server:4100;
}

server {
    listen 80;
    server_name api.tradovatefutures.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.tradovatefutures.com;

    ssl_certificate     /etc/ssl/cloudflare/tradovatefutures.crt;
    ssl_certificate_key /etc/ssl/cloudflare/tradovatefutures.key;

    location / {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

# ========================
# MAIN FRONTEND
# ========================
upstream frontend_app {
    server frontend:80;
}

server {
    listen 80;
    server_name tradovatefutures.com www.tradovatefutures.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tradovatefutures.com www.tradovatefutures.com;

    ssl_certificate     /etc/ssl/cloudflare/tradovatefutures.crt;
    ssl_certificate_key /etc/ssl/cloudflare/tradovatefutures.key;

    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
    }
}

# ========================
# ADMIN PORTAL
# ========================
upstream admin_portal {
    server admin_frontend:80;
}

server {
    listen 80;
    server_name portal.tradovatefutures.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name portal.tradovatefutures.com;

    ssl_certificate     /etc/ssl/cloudflare/tradovatefutures.crt;
    ssl_certificate_key /etc/ssl/cloudflare/tradovatefutures.key;

    location / {
        proxy_pass http://admin_portal;
        proxy_set_header Host $host;
    }
}
