name: Deploy Tradovate to VPS (Safe Blue-Green)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS (Blue-Green)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            PROJECT=tradovate
            NEW_PROJECT=tradovate_new
            PATH=${{ secrets.VPS_PATH }}

            echo "🚀 Starting blue-green deployment"
            cd $PATH

            echo "⬇️ Fetching latest code"
            git fetch origin
            git reset --hard origin/main

            echo "🔨 Building new images"
            docker compose -p $NEW_PROJECT build

            echo "▶️ Starting new containers"
            docker compose -p $NEW_PROJECT up -d

            echo "⏳ Waiting for containers to be healthy..."
            sleep 15

            echo "🔍 Checking container health"
            UNHEALTHY=$(docker ps \
              --filter "name=$NEW_PROJECT" \
              --filter "health=unhealthy" \
              --format '{{.Names}}')

            if [ -n "$UNHEALTHY" ]; then
              echo "❌ New containers are unhealthy:"
              echo "$UNHEALTHY"
              echo "🧹 Cleaning up failed deployment"
              docker compose -p $NEW_PROJECT down
              exit 1
            fi

            echo "✅ New containers healthy"

            echo "🛑 Stopping old containers"
            docker compose -p $PROJECT down || true

            echo "🔁 Promoting new containers"
            docker compose -p $NEW_PROJECT down
            docker compose -p $PROJECT up -d

            echo "🧹 Cleanup unused images"
            docker image prune -f

            echo "✅ Deployment completed successfully"
