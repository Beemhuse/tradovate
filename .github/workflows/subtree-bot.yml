name: Subtree Update Bot (SSH)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update-subtrees:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.GITHUB_SSH_KEY }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Configure Git
        run: |
          git config user.name "tradovate-bot"
          git config user.email "bot@tradovatefutures.com"

      - name: Add upstream remotes (SSH)
        run: |
          git remote add admin-upstream git@github.com:D-Inspire/admin_tradovatefutures.git || true
          git remote add frontend-upstream git@github.com:OWNER/frontend_tradovatefutures.git || true

      - name: Update admin subtree
        run: |
          git subtree pull --prefix=admin admin-upstream main --squash || true

      - name: Update frontend subtree
        run: |
          git subtree pull --prefix=frontend frontend-upstream main --squash || true

      - name: Create PR if changes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/subtree-updates
          title: "chore: update admin & frontend subtrees"
          body: "Automated subtree update via SSH."
