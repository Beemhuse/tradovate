name: Subtree Update Bot (SSH)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update-subtrees:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔑 THIS IS THE MISSING PIECE
      - name: Load SSH key into ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.TRADOVATE_SUBTREE_BOT }}

      - name: Trust GitHub host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Configure Git
        run: |
          git config user.name "tradovate-bot"
          git config user.email "bot@tradovatefutures.com"

      - name: Add upstream remotes (SSH)
        run: |
          git remote add admin-upstream git@github.com:D-Inspire/admin_tradovatefutures.git || true
          git remote add frontend-upstream git@github.com:D-Inspire/crypto-nexus-hubs.git || true

      # ✅ OPTIONAL BUT HIGHLY RECOMMENDED (DEBUG ONCE)
      - name: Verify SSH authentication
        run: ssh -T git@github.com || true

      - name: Update admin subtree
        run: git subtree pull --prefix=admin admin-upstream main --squash

      - name: Update frontend subtree
        run: git subtree pull --prefix=frontend frontend-upstream main --squash

      - name: Create PR if changes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/subtree-updates
          title: "chore: update admin & frontend subtrees"
          body: "Automated subtree update via SSH."
