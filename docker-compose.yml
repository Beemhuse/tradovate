services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tradovate
      POSTGRES_PASSWORD: super-strong-password-here
      POSTGRES_DB: tradovate
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - tradovate_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - tradovate_net
    restart: unless-stopped

  admin_server:
    build: ./server
    env_file:
      - ./server/.env
    depends_on:
      - db
      - redis
    networks:
      - tradovate_net
    ports:
      - "127.0.0.1:4000:4000"

    restart: unless-stopped

  frontend:
    build: ./frontend
    networks:
      - tradovate_net
    ports:
    - "127.0.0.1:3000:80"
    restart: unless-stopped

  admin_frontend:
    build: ./admin
    networks:
      - tradovate_net
    ports:
    - "127.0.0.1:3002:80"
    restart: unless-stopped

networks:
  tradovate_net:
    driver: bridge

volumes:
  db_data:
