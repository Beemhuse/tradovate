services:
  tradovate_db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tradovate
      POSTGRES_PASSWORD: super-strong-password-here
      POSTGRES_DB: tradovate
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    networks:
      - tradovate_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - tradovate_net

  admin_server:
    build: ./server
    env_file:
      - ./server/.env
    expose:
      - "4000"
    environment:
      DATABASE_URL: postgresql://tradovate:super-strong-password-here@tradovate_db:5432/tradovate
      REDIS_URL: redis://tradovate_redis:6379
    depends_on:
      - tradovate_db
      - redis
    restart: unless-stopped
    networks:
      - tradovate_net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - tradovate_net

  admin_frontend:
    build: ./admin
    expose:
      - "80"

    restart: unless-stopped
    networks:
      - tradovate_net

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - admin_server
      - frontend
      - admin_frontend
    restart: unless-stopped
    networks:
      - tradovate_net

networks:
  tradovate_net:
    driver: bridge

volumes:
  db_data:
